<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Booking — Andey’s Beachside</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar">Andey’s Beachside • Manage your booking</div><header><div class="container nav"><a class="brand" href="index.html">Andey’s Beachside<span>Beach days made easier.</span></a><nav><a href="index.html">Home</a><a href="index.html#book">New Booking</a></nav></div></header><main><section class="book"><div class="container"><div class="section-head"><div class="eyebrow">Phase 6</div><h2>Find Your Booking</h2><p>Use your confirmation code and the same email used when booking.</p></div><div class="panel manage-card"><div class="booking-grid"><label>Confirmation code<input id="lookupCode" placeholder="ABS-XXXXXX"></label><label>Email<input id="lookupEmail" type="email"></label></div><div class="actions"><button class="btn" onclick="lookup()">Find Booking</button></div><div id="result" style="margin-top:20px"></div></div></div></section></main><footer><div class="container">Andey’s Beachside Babysitting & Swim</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="data.js"></script><script>
let current=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function lookup(){try{current=await AndeyData.findBooking($('lookupCode').value,$('lookupEmail').value);if(!current){$('result').innerHTML='<div class="notice">No matching booking found.</div>';return}render()}catch(e){alert(e.message)}}function render(){$('result').innerHTML=`<div class="summary"><div class="summary-row"><span>Service</span><strong>${esc(current.service)}</strong></div><div class="summary-row"><span>Date / time</span><strong>${esc(current.date)} • ${esc(current.time)} • ${esc(current.duration)}</strong></div><div class="summary-row"><span>Status</span><strong>${esc(current.status)}</strong></div><div class="summary-row"><span>Payment</span><strong>${esc(current.paymentStatus||'Unpaid')}</strong></div></div>${current.status!=='Cancelled'?`<div class="actions"><button class="btn secondary" onclick="showReschedule()">Reschedule</button><button class="btn danger" onclick="cancelBooking()">Cancel Booking</button></div><div id="reschedule"></div>`:'<div class="notice">This booking is cancelled.</div>'}`}
function showReschedule(){$('reschedule').innerHTML=`<div class="panel" style="margin-top:16px"><h3>Request a new time</h3><div class="booking-grid"><label>New date<input id="newDate" type="date"></label><label>Duration<select id="newDuration"><option>30 minutes</option><option>1 hour</option><option>2 hours</option><option>3 hours</option><option>4 hours</option><option>5 hours</option></select></label><div class="full"><label>Available start times</label><div class="time-grid" id="newTimes"></div></div></div><div class="actions"><button class="btn" onclick="saveReschedule()">Save New Time</button></div></div>`;$('newDate').min=new Date().toISOString().slice(0,10);$('newDate').onchange=times;$('newDuration').onchange=times}let newStart=null,newTime='';async function times(){newStart=null;newTime='';const date=$('newDate').value,dur=$('newDuration').value,g=$('newTimes');if(!date)return g.innerHTML='Choose a date.';const busy=await AndeyData.listBusy(date),dm=AndeyData.durationMinutes(dur);g.innerHTML=AndeyData.slots.map(t=>{const st=AndeyData.mins(t),bad=st+dm>1200||busy.some(r=>AndeyData.rangesOverlap(st,st+dm,r.start_minute,r.end_minute));return `<button type="button" class="time-slot ${bad?'unavailable':''}" ${bad?'disabled':''} data-t="${t}" data-s="${st}">${t}</button>`}).join('');g.querySelectorAll('.time-slot:not(.unavailable)').forEach(b=>b.onclick=()=>{g.querySelectorAll('.time-slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');newStart=+b.dataset.s;newTime=b.dataset.t})}async function saveReschedule(){if(!$('newDate').value||newStart===null)return alert('Choose a new date and time.');const dur=$('newDuration').value;current=await AndeyData.customerReschedule(current.code,current.email,$('newDate').value,newStart,newStart+AndeyData.durationMinutes(dur),newTime,dur);alert('Reschedule request saved.');render()}async function cancelBooking(){if(!confirm('Cancel this booking?'))return;current=await AndeyData.customerCancel(current.code,current.email);render()}
</script></body></html>
